<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recipe Mode: allow the microphone</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="../options/options.css" />
    <script type="module" src="permission.js"></script>
  </head>
  <body>
    <div class="page permission">
      <header class="brandbar">Recipe Mode</header>
      <main>
        <div class="mark" aria-hidden="true">
          <svg width="56" height="56" viewBox="0 0 24 24" stroke-width="1.75">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3ZM19 10v2a7 7 0 0 1-14 0v-2M12 19v3" />
          </svg>
        </div>
        <div class="body">
          <h1>Allow the microphone</h1>
          <p>
            Side panels can't ask for microphone access, so Recipe Mode asks here once. Audio is transcribed by your
            browser and never recorded.
          </p>
          <button id="allow" type="button" class="btn primary">
            Allow microphone
            <svg width="24" height="24" viewBox="0 0 24 24" stroke-width="2.5" aria-hidden="true">
              <path d="M5 12h14M12 5l7 7-7 7" />
            </svg>
          </button>
          <p id="status" class="status" role="status"></p>
        </div>
      </main>
    </div>
  </body>
</html>
