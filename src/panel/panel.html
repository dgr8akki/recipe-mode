<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Recipe Mode side panel: the current step in large type, ingredients, timers and voice commands."
    />
    <title>Recipe Mode</title>
    <link rel="stylesheet" href="../theme.css" />
    <link rel="stylesheet" href="panel.css" />
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <header class="topbar">
      <h1 id="title" class="title">Recipe Mode</h1>
      <button
        id="settings-toggle"
        class="icon-button"
        type="button"
        aria-expanded="false"
        aria-controls="settings"
        aria-label="Settings"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" stroke-width="2" aria-hidden="true">
          <path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4" />
        </svg>
      </button>
    </header>

    <section id="settings" class="settings" aria-labelledby="settings-heading" hidden>
      <h2 id="settings-heading" class="visually-hidden">Panel settings</h2>
      <div class="connection">
        <p id="connection" role="status"></p>
        <button id="open-settings" type="button" class="btn"></button>
      </div>
      <p id="data-note" class="data-note"></p>
      <label class="check">
        <input id="read-aloud" type="checkbox" checked />
        <span class="box" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" stroke-width="3"><path d="M20 6 9 17l-5-5" /></svg>
        </span>
        Read answers aloud
      </label>
    </section>

    <section class="timers-region" aria-label="Timers">
      <ul id="timers" class="timers"></ul>
    </section>

    <main class="scroll">
      <section id="empty" class="empty">
        <svg width="44" height="44" viewBox="0 0 24 24" stroke-width="1.75" aria-hidden="true">
          <path
            d="M12 7v14M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"
          />
        </svg>
        <h2>Open a recipe to start</h2>
        <p>While this panel is open, Recipe Mode checks each page you view for a recipe. Most recipe sites work.</p>
      </section>

      <section id="recipe" class="recipe" hidden aria-labelledby="step-count">
        <ol id="progress" class="progress" aria-hidden="true"></ol>
        <p id="step-count" class="step-count"></p>
        <p id="step-text" class="step-text" aria-live="polite"></p>
        <div id="step-timers" class="step-timers"></div>
        <div id="up-next" class="up-next">
          <span id="up-next-label" class="label"></span>
          <span id="up-next-text"></span>
        </div>
      </section>

      <details id="ingredients" class="ingredients" hidden>
        <summary id="ingredients-summary">Ingredients</summary>
        <ul id="ingredient-list"></ul>
      </details>

      <section id="activity-section" class="activity" aria-labelledby="activity-heading" hidden>
        <h2 id="activity-heading" class="label">What you asked</h2>
        <ol id="activity" class="activity-list" aria-live="polite"></ol>
      </section>
    </main>

    <section id="dock" class="dock" hidden aria-label="Controls">
      <div class="step-nav">
        <button id="prev" type="button" class="nav-button" aria-label="Back">
          <svg width="24" height="24" viewBox="0 0 24 24" stroke-width="2.5" aria-hidden="true">
            <path d="m12 19-7-7 7-7M19 12H5" />
          </svg>
          <span class="nav-label">Back</span>
        </button>
        <button id="next" type="button" class="nav-button primary">
          <span id="next-label">Next step</span>
          <svg class="arrow" width="26" height="26" viewBox="0 0 24 24" stroke-width="2.75" aria-hidden="true">
            <path d="M5 12h14M12 5l7 7-7 7" />
          </svg>
          <svg class="check" width="26" height="26" viewBox="0 0 24 24" stroke-width="2.75" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" />
          </svg>
        </button>
      </div>

      <div class="voice">
        <button id="mic" type="button" class="mic" aria-pressed="false">
          <span class="rec" aria-hidden="true"></span>
          <svg class="mic-on" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3ZM19 10v2a7 7 0 0 1-14 0v-2M12 19v3" />
          </svg>
          <svg class="mic-off" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M2 2l20 20M18.89 13.23A7.12 7.12 0 0 0 19 12v-2M5 10v2a7 7 0 0 0 12 5M15 9.34V5a3 3 0 0 0-5.68-1.33M9 9v3a3 3 0 0 0 5.12 2.12M12 19v3"
            />
          </svg>
          <span id="mic-label">Start listening</span>
          <span class="level" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </button>
        <p id="heard" class="heard"></p>
        <form id="command-form" class="command">
          <input
            id="command"
            type="text"
            autocomplete="off"
            aria-label="Type a command"
            placeholder="Or type: next, how much butter?, set a timer"
          />
          <button type="submit" aria-label="Send command">
            <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M9 10l-5 5 5 5M20 4v7a4 4 0 0 1-4 4H4" />
            </svg>
          </button>
        </form>
      </div>
    </section>

    <template id="timer-template">
      <li class="timer">
        <svg class="bell" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M10.268 21a2 2 0 0 0 3.464 0M22 8c0-2.3-.8-4.3-2-6M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326M4 2C2.8 3.7 2 5.7 2 8"
          />
        </svg>
        <span class="timer-label"></span>
        <span class="timer-time" role="timer"></span>
        <button type="button" class="timer-remove">
          <svg width="24" height="24" viewBox="0 0 24 24" stroke-width="2.5" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
        <span class="timer-bar" aria-hidden="true"></span>
      </li>
    </template>
  </body>
</html>
